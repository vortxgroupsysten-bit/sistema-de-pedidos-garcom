<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garçom - Sistema de Pedidos</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- ========================================== -->
    <!-- TELA 1: LISTA DE MESAS                    -->
    <!-- ========================================== -->
    <div id="telaMesas" class="tela">
        <div class="header">
            <h1>🍽️ Mesas</h1>
            <div class="header-actions">
                <span id="horaAtual"></span>
            </div>
        </div>
        <div id="listaMesas" class="grid-mesas"></div>
    </div>

    <!-- ========================================== -->
    <!-- TELA 2: CARDÁPIO E CARRINHO               -->
    <!-- ========================================== -->
    <div id="telaPedido" class="tela" style="display: none;">
        <div class="header">
            <button id="btnVoltarMesas" class="btn-voltar">←</button>
            <h1 id="tituloMesa">Mesa 00</h1>
            <span id="statusMesa" class="status-badge"></span>
        </div>

        <!-- Cardápio -->
        <div class="secao">
            <h2>📋 Cardápio</h2>
            <div id="listaProdutos" class="lista-produtos"></div>
        </div>

        <!-- Carrinho -->
        <div class="secao carrinho">
            <div class="carrinho-header">
                <h2>🛒 Pedido</h2>
                <span id="totalItens" class="badge-itens">0 itens</span>
            </div>
            <div id="carrinhoItens" class="lista-carrinho"></div>
            <div class="carrinho-total">
                <span class="total-label">TOTAL</span>
                <span id="totalValor" class="total-valor">R$ 0,00</span>
            </div>
            <div class="carrinho-actions">
                <button id="btnFinalizarPedido" class="btn-principal">✅ FINALIZAR PEDIDO</button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL DE CONFIRMAÇÃO                      -->
    <!-- ========================================== -->
    <div id="modalConfirmacao" class="modal" style="display: none;">
        <div class="modal-content">
            <p id="mensagemModal" class="modal-mensagem"></p>
            <div class="modal-actions">
                <button id="modalCancelar" class="btn-modal-cancelar">Cancelar</button>
                <button id="modalConfirmar" class="btn-modal-confirmar">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL DE MENSAGEM                         -->
    <!-- ========================================== -->
    <div id="modalMensagem" class="modal" style="display: none;">
        <div class="modal-content">
            <p id="mensagemTexto" class="modal-mensagem"></p>
            <button id="modalMensagemOk" class="btn-modal-confirmar">OK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
