<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cozinha - Sistema de Pedidos</title>
    
    <!-- ========================================== -->
    <!-- FONTES E CSS                               -->
    <!-- ========================================== -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- ========================================== -->
    <!-- FIREBASE SDK                               -->
    <!-- ========================================== -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- ========================================== -->
    <!-- HEADER                                     -->
    <!-- ========================================== -->
    <div class="header">
        <h1>👨‍🍳 Cozinha</h1>
        <div class="header-actions">
            <span id="horaAtual"></span>
            <span class="badge-pedidos" id="qtdPedidos">0</span>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- LISTA DE PEDIDOS                          -->
    <!-- ========================================== -->
    <div id="listaPedidos" class="lista-pedidos"></div>

    <!-- ========================================== -->
    <!-- ESTADO VAZIO                              -->
    <!-- ========================================== -->
    <div id="estadoVazio" class="estado-vazio" style="display: none;">
        <div class="emoji">✅</div>
        <p>Todos os pedidos foram preparados!</p>
        <span class="subtitulo">Aguardando novos pedidos...</span>
    </div>

    <!-- ========================================== -->
    <!-- MODAL DE MENSAGEM                         -->
    <!-- ========================================== -->
    <div id="modalMensagem" class="modal" style="display: none;">
        <div class="modal-content">
            <p id="mensagemTexto" class="modal-mensagem"></p>
            <button id="modalMensagemOk" class="btn-modal-confirmar">OK</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT                                -->
    <!-- ========================================== -->
    <script src="script.js"></script>
</body>
</html>
